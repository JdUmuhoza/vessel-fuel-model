[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vessel-fuel-model"
version = "0.3.0"
description = "Physics-based and grey-box vessel fuel-consumption models, with multi-gas emission propagation"
authors = [{name = "Jean d'Amour Umuhoza", email = "jean.amour.umuhoza@uqac.ca"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "jupyter", "openpyxl", "matplotlib"]
ml  = ["xgboost>=1.7", "catboost>=1.2", "lightgbm>=4.0", "scikit-learn>=1.3", "pandas>=2.0", "joblib>=1.3", "pyarrow>=14"]
all = ["vessel-fuel-model[dev,ml]"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["vessel_fuel", "vessel_fuel.*"]
